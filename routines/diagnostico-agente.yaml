# Checklist de saúde do agente, com lógica condicional: cada checagem guarda a saída (save)
# e os passos seguintes decidem pelo when o que concluir.
# Só lê. O agente não pode iniciar serviços nem apagar nada (cerca do guard.py): quando acha um
# problema, a conclusão diz o comando que o usuário deve rodar.
name: diagnostico-agente
description: Checklist de saúde do agente. Confere se o Ollama está rodando, a memória livre do WSL, o espaço no disco C e o tamanho da quarentena (.trash), e diz o que fazer em cada problema. Só lê.

steps:
  # 1. Ollama: o processo do container aparece no ps do WSL (o container usa o mesmo kernel).
  - tool: run_command
    args: {command: "ps -eo comm="}
    save: processos
  - say: "Ollama rodando."
    when: {var: processos, matches: '^ollama$'}
  - say: "Ollama NÃO está rodando. No terminal do WSL, rode: docker start ollama"
    when: {var: processos, not_matches: '^ollama$'}

  # 2. Memória: a 6ª coluna do free -m é "available" (o que dá para usar sem tirar nada do cache).
  - tool: run_command
    args: {command: "free -m"}
    save: memoria
  - say: "Memória disponível no WSL abaixo de 2 GB: feche programas ou aumente memory no .wslconfig."
    when: {var: memoria, matches: '^Mem:\s+(?:\d+\s+){5}(\d+)', lt: 2048}
  - say: "Memória disponível no WSL ok (2 GB ou mais)."
    when: {var: memoria, matches: '^Mem:\s+(?:\d+\s+){5}(\d+)', gte: 2048}

  # 3. Disco C: (onde ficam o projeto e o disco virtual do WSL com os modelos).
  - tool: run_command
    args: {command: "df -h /mnt/c"}
    save: disco
  - say: "Disco C: com 90% ou mais de uso: crítico. Libere espaço antes de baixar outro modelo (5 a 12 GB cada)."
    when: {var: disco, matches: '(\d+)%\s+/mnt/c', gte: 90}
  - say: "Disco C: entre 75% e 90% de uso: atenção."
    when: {var: disco, matches: '(\d+)%\s+/mnt/c', gte: 75, lt: 90}
  - say: "Disco C: abaixo de 75% de uso: ok."
    when: {var: disco, matches: '(\d+)%\s+/mnt/c', lt: 75}

  # 4. Quarentena: só mede se a pasta existir (sem isso o du falharia numa máquina limpa).
  - tool: list_files
    args: {directory: "."}
    save: raiz
  - tool: run_command
    args: {command: "du -sh .trash"}
    save: quarentena
    when: {var: raiz, matches: '^DIR \| \.trash$'}
  - say: "A quarentena (.trash) passa de 1 GB. Revise e esvazie à mão: o agente nunca apaga de verdade."
    when: {var: quarentena, matches: '^([\d.]+)G', gte: 1}
  - say: "Quarentena (.trash) abaixo de 1 GB: ok."
    when: {var: quarentena, matches: '^[\d.]+[KM]?\s'}
  - say: "Quarentena (.trash) vazia ou inexistente."
    when: {var: raiz, not_matches: '^DIR \| \.trash$'}
